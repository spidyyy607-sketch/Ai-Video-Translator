<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TransReel — AI Video Translator & Social Reels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #060911;
      --bg-surface: #0e1424;
      --glass: rgba(16, 23, 40, 0.72);
      --glass-border: rgba(255, 255, 255, 0.1);
      --neon-cyan: #00e5ff;
      --neon-pink: #ff2a6d;
      --neon-purple: #8a2be2;
      --accent-grad: linear-gradient(135deg, #ff2a6d 0%, #8a2be2 50%, #00e5ff 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-body);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Glow */
    .ambient-orb {
      position: fixed;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }
    .orb-1 { top: -120px; left: -120px; background: radial-gradient(circle, var(--neon-purple), transparent 70%); }
    .orb-2 { bottom: -140px; right: -120px; background: radial-gradient(circle, var(--neon-cyan), transparent 70%); }

    /* App Container */
    .app-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      max-width: 440px;
      background: var(--bg-base);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 500px) {
      .app-frame {
        height: 94vh;
        border-radius: 32px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75);
      }
    }

    /* ================= LOGIN SCREEN ================= */
    #authScreen {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: radial-gradient(circle at 20% 15%, rgba(138, 43, 226, 0.28), transparent 50%),
                  radial-gradient(circle at 85% 85%, rgba(0, 229, 255, 0.2), transparent 50%),
                  var(--bg-base);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #authScreen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.04);
    }
    .brand-logo {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
      margin-bottom: 14px;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      max-width: 280px;
      margin-bottom: 26px;
      line-height: 1.45;
    }
    .auth-card {
      width: 100%;
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .btn-google {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: none;
      background: #fff;
      color: #0f172a;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-google:active { transform: scale(0.98); }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }
    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .input-field {
      width: 100%;
      padding: 13px 14px;
      border-radius: 13px;
      border: 1px solid var(--glass-border);
      background: rgba(6, 9, 17, 0.7);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--neon-cyan); }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--accent-grad);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(138, 43, 226, 0.45);
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }

    /* ================= TOP HEADER ================= */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(6, 9, 17, 0.85) 0%, transparent 100%);
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
    }
    .top-brand span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-pill {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(16, 23, 40, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 600;
      color: var(--neon-cyan);
      cursor: pointer;
    }

    /* ================= REELS FEED ================= */
    .feed-container {
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }

    .reel-card {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #090d16;
      overflow: hidden;
    }
    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0b101d;
    }
    .reel-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 35%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
    }

    /* Right Action Bar */
    .reel-actions {
      position: absolute;
      right: 14px;
      bottom: 92px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .action-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.15s, background 0.2s;
    }
    .action-btn:active .action-icon { transform: scale(0.9); }
    .action-btn.liked .action-icon { background: rgba(255, 42, 109, 0.35); border-color: var(--neon-pink); color: var(--neon-pink); }
    .action-btn.dub-btn .action-icon {
      background: var(--accent-grad);
      border: none;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
    }
    .action-label { font-size: 11px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

    /* Bottom Reel Info */
    .reel-info {
      position: absolute;
      left: 16px;
      right: 76px;
      bottom: 90px;
      z-index: 10;
    }
    .creator-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .creator-dp {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-grad);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .creator-name { font-weight: 700; font-size: 14px; }
    .follow-btn {
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .follow-btn.following { background: var(--neon-cyan); color: #060911; border-color: var(--neon-cyan); }
    .reel-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.35; }
    .reel-tags { font-size: 12px; color: var(--neon-cyan); font-weight: 500; }
    .lang-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.16);
      border: 1px solid rgba(0, 229, 255, 0.35);
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    /* ================= BOTTOM NAVIGATION ================= */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 25;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: 6px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-item.active { color: #fff; }
    .nav-icon { font-size: 20px; }
    .nav-plus {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--accent-grad);
      border: none;
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(255, 42, 109, 0.45);
      cursor: pointer;
      transform: translateY(-6px);
      transition: transform 0.15s;
    }
    .nav-plus:active { transform: translateY(-4px) scale(0.94); }

    /* ================= MODALS / DRAWERS ================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(4, 6, 12, 0.72);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      width: 100%;
      max-height: 88%;
      background: var(--bg-surface);
      border-top: 1px solid var(--glass-border);
      border-radius: 26px 26px 0 0;
      padding: 20px 18px 28px;
      overflow-y: auto;
      transform: translateY(30px);
      transition: transform 0.25s ease;
    }
    .modal-backdrop.open .modal-sheet { transform: translateY(0); }
    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255,255,255,0.22);
      margin: 0 auto 16px;
    }
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .sheet-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    /* Profile Tabs & Grid */
    .profile-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .profile-avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
    }
    .profile-stats { display: flex; gap: 16px; margin-top: 4px; font-size: 12px; color: var(--text-muted); }
    .profile-stats b { color: #fff; }
    .tabs-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(6, 9, 17, 0.7);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent-grad);
      color: #fff;
      box-shadow: 0 4px 14px rgba(138, 43, 226, 0.35);
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .grid-card {
      position: relative;
      aspect-ratio: 9 / 14;
      border-radius: 16px;
      overflow: hidden;
      background: #060911;
      border: 1px solid var(--glass-border);
      cursor: pointer;
    }
    .grid-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .grid-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.9);
      color: #060911;
      font-size: 10px;
      font-weight: 800;
    }
    .grid-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 8px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Upload & AI Generator */
    .upload-zone {
      border: 1.5px dashed rgba(0, 229, 255, 0.45);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: rgba(0, 229, 255, 0.05);
      margin-bottom: 16px;
      cursor: pointer;
    }
    .ai-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .btn-ai {
      padding: 7px 12px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #00e5ff, #8a2be2);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.3);
    }
    .btn-ai:active { transform: scale(0.96); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chip {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.selected {
      background: rgba(0, 229, 255, 0.18);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    /* Toast Notification */
    .toast {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      z-index: 60;
      background: rgba(14, 20, 36, 0.95);
      border: 1px solid var(--neon-cyan);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="app-frame">
    <!-- Toast -->
    <div id="toast" class="toast">Saved to Dubbed Folder!</div>

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="authScreen">
      <div class="brand-logo">TR</div>
      <div class="brand-title">TransReel</div>
      <div class="brand-sub">Watch, translate, and dub short videos into any language with AI voice cloning.</div>

      <div class="auth-card">
        <button class="btn-google" onclick="loginUser()">
          <span>G</span> Continue with Google
        </button>
        <div class="divider">or sign in with email</div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" class="input-field" value="creator@transreel.ai" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" class="input-field" value="••••••••••" />
        </div>
        <button class="btn-primary" onclick="loginUser()">Sign In</button>
      </div>
    </div>

    <!-- ================= TOP BAR ================= -->
    <div class="top-bar">
      <div class="top-brand">TR <span>TransReel</span></div>
      <button class="top-pill" onclick="openProfile('dubbed')">📁 Dubbed (<span id="dubCountTop">1</span>)</button>
    </div>

    <!-- ================= MAIN REELS FEED ================= -->
    <div id="feedContainer" class="feed-container"></div>

    <!-- ================= BOTTOM NAV ================= -->
    <div class="bottom-nav">
      <button class="nav-item active" onclick="showToast('You are on Home Feed')">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="nav-item" onclick="openDubModal()">
        <span class="nav-icon">🎙️</span>
        <span>AI Dub</span>
      </button>
      <button class="nav-plus" onclick="openCreateModal()" title="Create Post">+</button>
      <button class="nav-item" onclick="openProfile('dubbed')">
        <span class="nav-icon">📁</span>
        <span>Dubbed</span>
      </button>
      <button class="nav-item" onclick="openProfile('reels')">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </button>
    </div>

    <!-- ================= CREATE POST MODAL ================= -->
    <div id="createModal" class="modal-backdrop" onclick="closeModalOutside(event, 'createModal')">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="sheet-title">Create New Post</div>
          <button class="close-btn" onclick="closeModal('createModal')">✕</button>
        </div>

        <label class="upload-zone" for="postVideoInput" style="display:block;">
          <div style="font-size:26px; margin-bottom:6px;">🎬</div>
          <div id="postFileName" style="font-size:13px; font-weight:600;">Tap to select video from Gallery</div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">MP4, MOV, WebM supported</div>
          <input type="file" id="postVideoInput" accept="video/*" style="display:none;" onchange="handlePostFile(event)" />
        </label>

        <div class="ai-row">
          <label style="font-size:12px; color:var(--text-muted); font-weight:600;">VIDEO DETAILS (EDITABLE)</label>
          <button class="btn-ai" id="aiGenBtn" onclick="generateAIMetadata()">✨ Generate with AI</button>
        </div>

        <div class="input-group">
          <label>Title</label>
          <input type="text" id="postTitle" class="input-field" placeholder="Write a catchy title or use AI..." />
        </div>
        <div class="input-group">
          <label>Hashtags</label>
          <input type="text" id="postTags" class="input-field" placeholder="#TransReel #AI #Viral" />
        </div>

        <button class="btn-primary" onclick="publishPost()">🚀 Publish to Feed</button>
      </div>
    </div>

    <!-- ================= AI DUBBING MODAL ================= -->
    <div id="dubModal" class="modal-backdrop" onclick="closeModalOutside(event, 'dubModal')">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="sheet-title">AI Video Dubbing</div>
          <button class="close-btn" onclick="closeModal('dubModal')">✕</button>
        </div>

        <label class="upload-zone" for="dubVideoInput" style="display:block;">
          <div style="font-size:24px; margin-bottom:4px;">📤</div>
          <div id="dubFileName" style="font-size:13px; font-weight:600;">Use Current Reel or Upload from Gallery</div>
          <input type="file" id="dubVideoInput" accept="video/*" style="display:none;" onchange="handleDubFile(event)" />
        </label>

        <div style="font-size:12px; color:var(--text-muted); font-weight:600; margin-bottom:8px;">TARGET LANGUAGE</div>
        <div class="chip-row" id="langChips">
          <button class="chip selected" onclick="selectChip(this, 'lang')">Hindi 🇮🇳</button>
          <button class="chip" onclick="selectChip(this, 'lang')">English 🇺🇸</button>
          <button class="chip" onclick="selectChip(this, 'lang')">Spanish 🇪🇸</button>
          <button class="chip" onclick="selectChip(this, 'lang')">Urdu 🇵🇰</button>
          <button class="chip" onclick="selectChip(this, 'lang')">Arabic 🇸🇦</button>
        </div>

        <div style="font-size:12px; color:var(--text-muted); font-weight:600; margin-bottom:8px;">VOICE STYLE</div>
        <div class="chip-row" id="voiceChips">
          <button class="chip selected" onclick="selectChip(this, 'voice')">AI Voice</button>
          <button class="chip" onclick="selectChip(this, 'voice')">Voice Cloning</button>
          <button class="chip" onclick="selectChip(this, 'voice')">Storytelling</button>
        </div>

        <button class="btn-primary" id="startDubBtn" onclick="startDubbing()">🎙️ Dub & Save to Dubbed Folder</button>
      </div>
    </div>

    <!-- ================= PROFILE MODAL ================= -->
    <div id="profileModal" class="modal-backdrop" onclick="closeModalOutside(event, 'profileModal')">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="sheet-title">Creator Profile</div>
          <button class="close-btn" onclick="closeModal('profileModal')">✕</button>
        </div>

        <div class="profile-top">
          <div class="profile-avatar">AZ</div>
          <div>
            <div style="font-weight:700; font-size:16px;">@azam_creator</div>
            <div class="profile-stats">
              <span><b id="myReelsCount">1</b> Reels</span>
              <span><b id="dubbedCount">1</b> Dubbed</span>
              <span><b>12.4K</b> Followers</span>
            </div>
          </div>
          <button onclick="logoutUser()" style="margin-left:auto; padding:6px 12px; border-radius:10px; border:1px solid var(--glass-border); background:rgba(255,42,109,0.15); color:#ff6b93; font-size:12px; font-weight:600; cursor:pointer;">Logout</button>
        </div>

        <div class="tabs-row">
          <button id="tabReels" class="tab-btn active" onclick="switchProfileTab('reels')">🎬 My Reels</button>
          <button id="tabDubbed" class="tab-btn" onclick="switchProfileTab('dubbed')">📁 Dubbed Folder</button>
        </div>

        <div id="profileGrid" class="video-grid"></div>
      </div>
    </div>
  </div>

  <script>
    // Sample Reels Data
    const sampleVideos = [
      "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-1232-large.mp4",
      "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4",
      "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4"
    ];

    let reels = [
      {
        id: 1,
        creator: "@neha_vlogs",
        initials: "NV",
        title: "Tokyo night walk with AI Hindi dubbing 🔥",
        tags: "#TransReel #Tokyo #AIDubbing",
        lang: "Original: English",
        likes: 1240,
        liked: false,
        following: false,
        videoUrl: sampleVideos[0]
      },
      {
        id: 2,
        creator: "@tech_arjun",
        initials: "TA",
        title: "How AI Voice Cloning changes content creation forever",
        tags: "#AI #CreatorEconomy #Tech",
        lang: "Original: Hindi",
        likes: 892,
        liked: false,
        following: false,
        videoUrl: sampleVideos[1]
      },
      {
        id: 3,
        creator: "@ocean_vibes",
        initials: "OV",
        title: "Relaxing ocean waves — translated in 5 languages 🌊",
        tags: "#Travel #Relax #GlobalReels",
        lang: "Original: Spanish",
        likes: 2310,
        liked: false,
        following: false,
        videoUrl: sampleVideos[2]
      }
    ];

    let myReels = [
      {
        title: "My First TransReel Upload",
        tags: "#TransReel #Creator",
        videoUrl: sampleVideos[0]
      }
    ];

    let dubbedFolder = [
      {
        title: "Tokyo night walk (Dubbed)",
        lang: "Hindi 🇮🇳",
        voice: "Voice Cloning",
        videoUrl: sampleVideos[0]
      }
    ];

    let selectedPostUrl = null;
    let selectedDubUrl = null;
    let selectedLang = "Hindi 🇮🇳";
    let selectedVoice = "AI Voice";
    let currentProfileTab = "reels";

    function loginUser() {
      document.getElementById("authScreen").classList.add("hidden");
      renderFeed();
      updateCounts();
    }

    function logoutUser() {
      closeModal("profileModal");
      document.getElementById("authScreen").classList.remove("hidden");
    }

    function renderFeed() {
      const container = document.getElementById("feedContainer");
      container.innerHTML = reels.map((r, idx) => `
        <div class="reel-card">
          <video class="reel-video" src="${r.videoUrl}" autoplay loop muted playsinline onclick="togglePlay(this)"></video>
          <div class="reel-overlay"></div>

          <div class="reel-actions">
            <button class="action-btn ${r.liked ? 'liked' : ''}" onclick="toggleLike(${idx})">
              <div class="action-icon">❤️</div>
              <span class="action-label">${r.likes}</span>
            </button>
            <button class="action-btn" onclick="showToast('Comments coming soon!')">
              <div class="action-icon">💬</div>
              <span class="action-label">142</span>
            </button>
            <button class="action-btn dub-btn" onclick="openDubModal('${r.videoUrl}', '${r.title.replace(/'/g, "")}')">
              <div class="action-icon">🌐</div>
              <span class="action-label">AI Dub</span>
            </button>
            <button class="action-btn" onclick="showToast('Link copied to clipboard!')">
              <div class="action-icon">↗️</div>
              <span class="action-label">Share</span>
            </button>
          </div>

          <div class="reel-info">
            <div class="creator-row">
              <div class="creator-dp">${r.initials}</div>
              <div class="creator-name">${r.creator}</div>
              <button class="follow-btn ${r.following ? 'following' : ''}" onclick="toggleFollow(${idx})">
                ${r.following ? 'Following' : 'Follow'}
              </button>
            </div>
            <div class="reel-title">${r.title}</div>
            <div class="reel-tags">${r.tags}</div>
            <div class="lang-pill">🎙️ ${r.lang}</div>
          </div>
        </div>
      `).join("");
    }

    function togglePlay(video) {
      if (video.paused) video.play();
      else video.pause();
    }

    function toggleLike(idx) {
      reels[idx].liked = !reels[idx].liked;
      reels[idx].likes += reels[idx].liked ? 1 : -1;
      renderFeed();
    }

    function toggleFollow(idx) {
      reels[idx].following = !reels[idx].following;
      renderFeed();
    }

    /* ================= CREATE POST + AI GENERATOR ================= */
    function openCreateModal() {
      document.getElementById("createModal").classList.add("open");
    }

    function handlePostFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedPostUrl = URL.createObjectURL(file);
      document.getElementById("postFileName").textContent = "✅ " + file.name;
    }

    function generateAIMetadata() {
      const btn = document.getElementById("aiGenBtn");
      const titleInput = document.getElementById("postTitle");
      const tagsInput = document.getElementById("postTags");

      const presets = [
        {
          title: "Watch till the end! AI dubbed this in 10 seconds 🤯🔥",
          tags: "#TransReel #AIDubbing #ViralReels #Trending2026 #Creator"
        },
        {
          title: "Breaking language barriers with one tap 🌍✨",
          tags: "#GlobalCreator #VoiceCloning #TransReel #ShortVideo #AI"
        },
        {
          title: "You won't believe this voice is 100% AI generated 🎙️⚡",
          tags: "#AIVoice #TechReels #TransReel #MustWatch #Explore"
        }
      ];
      const pick = presets[Math.floor(Math.random() * presets.length)];

      btn.textContent = "✨ Generating...";
      titleInput.value = "";
      tagsInput.value = "";

      let i = 0;
      const typeTitle = setInterval(() => {
        titleInput.value += pick.title[i++];
        if (i >= pick.title.length) {
          clearInterval(typeTitle);
          let j = 0;
          const typeTags = setInterval(() => {
            tagsInput.value += pick.tags[j++];
            if (j >= pick.tags.length) {
              clearInterval(typeTags);
              btn.textContent = "✨ Generate with AI";
            }
          }, 18);
        }
      }, 22);
    }

    function publishPost() {
      const title = document.getElementById("postTitle").value.trim() || "New TransReel Video";
      const tags = document.getElementById("postTags").value.trim() || "#TransReel #AI";
      const videoUrl = selectedPostUrl || sampleVideos[0];

      reels.unshift({
        id: Date.now(),
        creator: "@azam_creator",
        initials: "AZ",
        title,
        tags,
        lang: "Original: Uploaded",
        likes: 1,
        liked: true,
        following: true,
        videoUrl
      });

      myReels.unshift({ title, tags, videoUrl });
      updateCounts();
      renderFeed();
      document.getElementById("feedContainer").scrollTo({ top: 0, behavior: "smooth" });

      // Reset
      selectedPostUrl = null;
      document.getElementById("postFileName").textContent = "Tap to select video from Gallery";
      document.getElementById("postTitle").value = "";
      document.getElementById("postTags").value = "";
      closeModal("createModal");
      showToast("🚀 Video published to Feed & My Reels!");
    }

    /* ================= AI DUBBING & DUBBED FOLDER ================= */
    let currentDubTitle = "Dubbed Reel";

    function openDubModal(videoUrl = null, title = "Uploaded Video") {
      selectedDubUrl = videoUrl || reels[0].videoUrl;
      currentDubTitle = title;
      document.getElementById("dubFileName").textContent = videoUrl
        ? "🎬 Selected: " + title.slice(0, 28) + "..."
        : "Use Current Reel or Upload from Gallery";
      document.getElementById("dubModal").classList.add("open");
    }

    function handleDubFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedDubUrl = URL.createObjectURL(file);
      currentDubTitle = file.name.replace(/\.[^/.]+$/, "");
      document.getElementById("dubFileName").textContent = "✅ " + file.name;
    }

    function selectChip(el, type) {
      el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
      el.classList.add("selected");
      if (type === "lang") selectedLang = el.textContent;
      if (type === "voice") selectedVoice = el.textContent;
    }

    function startDubbing() {
      const btn = document.getElementById("startDubBtn");
      btn.textContent = "⏳ Processing AI Dub...";
      btn.disabled = true;

      setTimeout(() => {
        dubbedFolder.unshift({
          title: currentDubTitle,
          lang: selectedLang,
          voice: selectedVoice,
          videoUrl: selectedDubUrl || sampleVideos[0]
        });

        updateCounts();
        btn.textContent = "🎙️ Dub & Save to Dubbed Folder";
        btn.disabled = false;
        closeModal("dubModal");
        showToast(`✅ Saved in Dubbed Folder (${selectedLang})`);
        openProfile("dubbed");
      }, 1200);
    }

    /* ================= PROFILE & DUBBED FOLDER ================= */
    function openProfile(tab = "reels") {
      document.getElementById("profileModal").classList.add("open");
      switchProfileTab(tab);
    }

    function switchProfileTab(tab) {
      currentProfileTab = tab;
      document.getElementById("tabReels").classList.toggle("active", tab === "reels");
      document.getElementById("tabDubbed").classList.toggle("active", tab === "dubbed");
      renderProfileGrid();
    }

    function renderProfileGrid() {
      const grid = document.getElementById("profileGrid");
      if (currentProfileTab === "reels") {
        if (!myReels.length) {
          grid.innerHTML = `<div class="empty-state">No reels posted yet. Tap + to create one!</div>`;
          return;
        }
        grid.innerHTML = myReels.map(item => `
          <div class="grid-card" onclick="showToast('Playing: ${item.title.replace(/'/g, "")}')">
            <video src="${item.videoUrl}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>
            <div class="grid-title">${item.title}</div>
          </div>
        `).join("");
      } else {
        if (!dubbedFolder.length) {
          grid.innerHTML = `<div class="empty-state">No dubbed videos yet. Tap 🌐 AI Dub on any reel!</div>`;
          return;
        }
        grid.innerHTML = dubbedFolder.map(item => `
          <div class="grid-card" onclick="playDubbedVideo('${item.videoUrl}', '${item.title.replace(/'/g, "")}', '${item.lang}')">
            <video src="${item.videoUrl}" muted loop playsinline></video>
            <div class="grid-badge">${item.lang}</div>
            <div class="grid-title">${item.title}</div>
          </div>
        `).join("");
      }
    }

    function playDubbedVideo(url, title, lang) {
      reels.unshift({
        id: Date.now(),
        creator: "@azam_creator",
        initials: "AZ",
        title: title + " (Dubbed)",
        tags: "#DubbedFolder #TransReel",
        lang: "Dubbed: " + lang,
        likes: 1,
        liked: false,
        following: true,
        videoUrl: url
      });
      renderFeed();
      closeModal("profileModal");
      document.getElementById("feedContainer").scrollTo({ top: 0, behavior: "smooth" });
      showToast(`▶️ Playing Dubbed Video (${lang})`);
    }

    function updateCounts() {
      document.getElementById("myReelsCount").textContent = myReels.length;
      document.getElementById("dubbedCount").textContent = dubbedFolder.length;
      document.getElementById("dubCountTop").textContent = dubbedFolder.length;
    }

    /* ================= HELPERS ================= */
    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }
    function closeModalOutside(e, id) {
      if (e.target.id === id) closeModal(id);
    }
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2600);
    }
  </script>
</body>
</html>
